# The colours of Freeplane's own dark_nord_template.mm map style, which is built on the
# Nord palette. One change from that template: level 1's text is #2e3440 rather than the
# template's #eceff4, whose contrast against #d08770 is 2.47 — too low to read comfortably.
name: Nord
credits: Freeplane's dark_nord_template.mm; Nord, https://github.com/nordtheme/nord (MIT)
canvas: "#2e3440"
edge: "#81a1c1"
selection: {text: "#e5e9f0", background: "#5e81ac"}
root: {text: "#ffffff", background: "#484747"}
# Done tasks: nord1 as the background; the text is a grey between nord3 and nord4,
# not a Nord colour, since nord3's contrast against nord1 is too low to read.
task_done: {text: "#8a94a8", background: "#3b4252"}
levels:
  - {text: "#2e3440", background: "#d08770"}
  - {text: "#3b4252", background: "#ebcb8b"}
  - {text: "#2e3440", background: "#a3be8c"}
  - {text: "#2e3440", background: "#b48ead"}
  - {text: "#484747", background: "#81a1c1"}
  - {text: "#484747", background: "#88c0d0"}
  - {text: "#484747", background: "#8fbcbb"}
  - {text: "#484747", background: "#d8dee9"}
  - {text: "#484747", background: "#e5e9f0"}
  - {text: "#484747", background: "#eceff4"}
