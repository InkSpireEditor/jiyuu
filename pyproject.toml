[project]
name = "jiyuu"
version = "0.1.0"
description = "A FreeMind/Freeplane-compatible mindmap viewer and editor"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
requires-python = ">=3.12,<4.0.0"
dependencies = [
    "flet (>=1.0.4,<2.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "defusedxml (>=0.7.1,<0.8.0)",
    "typer",
    "pillow",
]

[project.scripts]
jiyuu = "jiyuu.cli:app"

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "pylint (>=4.0.8,<5.0.0)",
    "ty (>=0.0.80,<0.0.81)",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.12.10,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
# The package is the `jiyuu` folder at the repository root, not under `src/`.
module-root = ""
