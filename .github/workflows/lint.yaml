name: Pylint

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up uv and Python 3.14
        uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --locked

      - name: Run pylint
        run: uv run pylint --rcfile=.github/workflows/pylintrc --fail-under=9.5 jiyuu

      - name: Run ty
        run: uv run ty check
