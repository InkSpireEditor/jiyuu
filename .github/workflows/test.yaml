name: Pytest

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up uv and Python 3.14
        uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --locked

      - name: Run pytest
        run: uv run pytest --cov jiyuu --cov-report=term-missing
