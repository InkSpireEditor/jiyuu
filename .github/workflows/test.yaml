name: Pytest

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up uv and Python 3.14
        uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --locked

      # The tests that run taskwarrior's `task` command are skipped without it.
      - name: Install taskwarrior
        run: |
          sudo apt-get update
          sudo apt-get install -y taskwarrior

      - name: Run pytest
        run: uv run pytest --cov jiyuu --cov-report=term-missing
